/* ---------- medical aid (simulated claims switch) ---------- */
const money=n=>'R '+(+n).toLocaleString('en-ZA',{minimumFractionDigits:2,maximumFractionDigits:2});
const POT={savings:'Medical savings account',d2d:'Day-to-day benefit',risk:'Risk benefit (PMB chronic)'};
function decide(p,code){const fee=TARIFF[code][1],m=p.ma||{state:'cash'};
 if(m.state==='cash')return {mode:'cash',fee,scheme:0,pt:fee,label:'Private patient — collect cash',why:'No medical aid on file.'};
 if(m.state==='suspended')return {mode:'cash',fee,scheme:0,pt:fee,label:'Do not bill scheme — collect cash',why:'Membership suspended since '+m.since+' (contributions in arrears). Claims will be rejected.'};
 const rate=Math.round(m.rate*fee/560);const cov=Math.min(rate,fee);
 if(m.pot==='risk'){const pt=fee-cov;return {mode:pt?'copay':'aid',fee,scheme:cov,pt,label:pt?'Bill scheme + collect '+money(pt)+' shortfall':'Bill scheme — covered in full',why:'Registered PMB condition at a designated provider — paid from risk, not savings.'}}
 if(m.avail<=0)return {mode:'cash',fee,scheme:0,pt:fee,label:'Savings depleted — collect cash upfront',why:'Member is in the self-payment gap. Scheme will not pay day-to-day claims until the threshold is reached.'};
 if(m.avail<cov){const pt=fee-m.avail;return {mode:'copay',fee,scheme:m.avail,pt,label:'Partial cover — collect '+money(pt),why:'Only '+money(m.avail)+' left in '+POT[m.pot].toLowerCase()+'.'}}
 const pt=fee-cov;return {mode:pt?'copay':'aid',fee,scheme:cov,pt,label:pt?'Bill scheme + collect '+money(pt)+' co-payment':'Bill scheme — covered in full',why:pt?'Practice fee is above the scheme rate of '+money(cov)+'; the difference is the patient\'s.':'Practice fee is within the scheme rate.'}}
function runCheck(p){const d=decide(p,'0191');return {ref:'MC-'+(++S.seq.mc),time:nowHM(),state:(p.ma||{}).state||'cash',dec:d}}
const fundPill=a=>{if(!a.ver)return a.status==='done'?'':'<span class="pill">Not verified</span>';const d=a.ver.dec;
 return d.mode==='aid'?'<span class="pill ok">Med aid ✓</span>':d.mode==='copay'?`<span class="pill warn">Co-pay ${money(d.pt)}</span>`:`<span class="pill bad">Cash ${money(d.pt)}</span>`};

function vflags(){
 const v=S.consult.vitals,f=[];
 const sys=+v.sys,dia=+v.dia,t=+v.temp,o=+v.spo2,hr=+v.hr,g=+v.gluc,w=+v.wt,ht=+v.ht;
 if(sys&&dia){if(sys>=180||dia>=110)f.push(['bad','BP severely raised']);else if(sys>=140||dia>=90)f.push(['warn','BP raised']);else if(sys<90)f.push(['bad','Hypotensive']);else f.push(['ok','BP normal'])}
 if(t){if(t>=38)f.push(['bad','Febrile '+t+'°C']);else if(t>=37.5)f.push(['warn','Low-grade temp']);else f.push(['ok','Afebrile'])}
 if(o){if(o<92)f.push(['bad','SpO₂ low']);else if(o<95)f.push(['warn','SpO₂ borderline']);else f.push(['ok','SpO₂ normal'])}
 if(hr){if(hr>100)f.push(['warn','Tachycardic']);else if(hr<50)f.push(['warn','Bradycardic'])}
 if(g){if(g>=11.1)f.push(['bad','Glucose high']);else if(g<4)f.push(['bad','Hypoglycaemia'])}
 if(w&&ht){const b=w/((ht/100)**2);f.push([b>=30?'warn':'ok','BMI '+b.toFixed(1)])}
 return f.length?f.map(x=>`<span class="pill ${x[0]}">${x[1]}</span>`).join(''):'<span class="sub sm">Flags appear as you capture vitals</span>'}

function checkDrug(d,p){
 const out=[];
 p.allergies.forEach(a=>{if(a.cls===d.cls)out.push({lvl:'al',msg:`ALLERGY: patient has a documented ${CLSP[a.cls]} allergy (${a.reaction}). ${d.name} is a ${CLS[a.cls]}.`})});
 if(d.cls==='nsaid'&&p.meds.some(m=>DRUG[m].cls==='acei'))out.push({lvl:'cau',msg:'Interaction: patient is on an ACE inhibitor (enalapril). NSAIDs blunt BP control and increase risk of acute kidney injury.'});
 if(d.cls==='nsaid'&&p.chronic.some(x=>/asthma/i.test(x)))out.push({lvl:'cau',msg:'Caution: asthmatic patient — NSAIDs can precipitate bronchospasm.'});
 if(p.meds.includes(d.id))out.push({lvl:'cau',msg:`Duplicate: already on chronic ${d.name}.`});
 if(S.consult.rx.some(r=>r.id===d.id))out.push({lvl:'cau',msg:'Already on this script.'});
 return out}

 </div>`}).join(''):'<p class="sub">No items yet.</p>'}

function snDoc(sn,p,dx,no,issued){const d=S.doc;const to=addDays(sn.from,Math.max(1,+sn.days||1)-1);const n=Math.max(1,+sn.days||1);
 return `<div class="doc"><div class="dh"><div><b>${esc(d.practice)}</b><br>${esc(d.address)}<br>Tel ${esc(d.phone)} · Practice no. ${esc(d.practiceNo)}</div><div style="text-align:right">No. <b style="font-size:14px">${no}</b><br>${sdate(issued||TODAY)}</div></div>
 <div class="ttl">MEDICAL CERTIFICATE</div>
 <p>I, <b>${esc(d.name)}</b>, ${esc(d.qual)} (HPCSA ${esc(d.hpcsa)}), certify that ${sn.basis==='exam'?'I personally examined':'I consulted with'} <b>${esc(fullName(p))}</b> (ID ${esc(p.idno)}) on <b>${sdate(issued||TODAY)}</b> at ${sn.time||nowHM()}.</p>
 <p>${sn.basis==='exam'?'This certificate is based on my examination of the patient.':'This certificate is based on information provided by the patient; the patient was not physically examined.'}</p>
 <p>In my opinion the patient is <b>${sn.fitness==='total'?'unfit for work / school':'fit for light duties only'}</b> from <b>${sdate(sn.from)}</b> to <b>${sdate(to)}</b> inclusive (${n} day${n>1?'s':''}).</p>
 <p><b>Nature of illness:</b> ${sn.showDx&&dx.length?esc(icdName(dx[0]))+' ('+dx[0]+')':'<i>Withheld — patient did not consent to disclosure.</i>'}</p>
 ${sn.remarks?`<p><b>Remarks:</b> ${esc(sn.remarks)}</p>`:''}
 <div class="sig"><div>${issued?`<div class="esig">${esc(d.name.replace(/^Dr\.?\s*/,''))}</div>`:'<div class="sub sm" style="font-family:sans-serif">Signature applied on issue</div>'}<div class="ln">${esc(d.name)} · ${esc(d.qual)}<br>HPCSA ${esc(d.hpcsa)}</div></div><div style="font-family:sans-serif;font-size:11px;text-align:right">Verify: ${no}</div></div>
 <div class="ft">Issued in line with HPCSA guidelines on medical certificates. Diagnosis disclosed only with patient consent.</div></div>`}
function tabSN(){const c=S.consult,p=P(c.pid);
 if(c.snIssued){const n=S.notes.find(x=>x.no===c.snIssued);return `<div class="card" style="background:var(--g50);border:0;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><div><h3 style="margin:0">Sick note ${n.no} issued</h3><b>${n.sn.days} day(s) from ${sdate(n.sn.from)}</b></div><div style="display:flex;gap:8px"><button class="btn sec sm" data-a="viewSN" data-v="${n.no}">View / print</button><button class="btn sec sm" data-a="emailSN">Email to patient</button></div></div>
 <div style="display:flex;justify-content:flex-end;margin-top:18px"><button class="btn" data-a="tab" data-v="close">Next: Close & bill →</button></div>`}
 return `<div class="grid2" style="align-items:start"><div>
 <div class="grid2"><div class="f"><label>From</label><input type="date" data-bind="consult.sn.from" data-upd="snprev" value="${c.sn.from}"></div><div class="f"><label>Days</label><input type="number" min="1" max="30" data-bind="consult.sn.days" data-upd="snprev" value="${c.sn.days}"></div></div>
 <div class="f"><label>Fitness</label><select data-bind="consult.sn.fitness" data-upd="snprev"><option value="total" ${c.sn.fitness==='total'?'selected':''}>Unfit for work / school</option><option value="partial" ${c.sn.fitness==='partial'?'selected':''}>Fit for light duties only</option></select></div>
 <div class="f"><label>Basis</label><select data-bind="consult.sn.basis" data-upd="snprev"><option value="exam" ${c.sn.basis==='exam'?'selected':''}>Patient examined</option><option value="reported" ${c.sn.basis==='reported'?'selected':''}>Patient-reported (not examined)</option></select></div>
 <label class="checkrow" style="text-transform:none;letter-spacing:0;color:#000"><input type="checkbox" data-bind="consult.sn.showDx" data-upd="snprev" ${c.sn.showDx?'checked':''}> Patient consents to showing diagnosis</label>
 <div class="f" style="margin-top:12px"><label>Remarks (optional)</label><textarea data-bind="consult.sn.remarks" data-upd="snprev" rows="2" placeholder="e.g. Avoid heavy lifting for 2 weeks">${esc(c.sn.remarks)}</textarea></div>
 <button class="btn ac full" data-a="issueSN">Sign & issue sick note</button>
 <button class="btn sec full" style="margin-top:8px" data-a="tab" data-v="close">No sick note needed →</button>
 </div><div id="snprev">${snPrev()}</div></div>`}
function snPrev(){const c=S.consult;return snDoc(c.sn,P(c.pid),c.dx,'SN-'+(S.seq.sn+1),null)}

 <div class="kv"><span>Diagnosis</span><b>${c.dx.length?c.dx.map(d=>`<span class="code">${d}</span>`).join(', '):'<span style="color:var(--red)">Missing</span>'}</b></div>

 const tabs=[['notes','Notes & vitals'],['dx','Diagnosis',c.dx.length],['rx','Prescription',c.rxSent?'✓':c.rx.length],['sn','Sick note',c.snIssued?'✓':0],['close','Close & bill']];

 <div class="tabs">${tabs.map(t=>`<button class="tab ${c.tab===t[0]?'on':''}" data-a="tab" data-v="${t[0]}">${t[1]}${t[2]?`<span class="c">${t[2]}</span>`:''}</button>`).join('')}</div>

 <button class="btn sec full sm" data-a="cancelConsult">Abandon consult</button></div></div>`}

   <div class="kv"><span>Registered chronic (PMB)</span><b>${ma.pmb.length?ma.pmb.map(esc).join(', '):'None'}</b></div><div class="kv"><span>Network / DSP</span><b>${ma.network?'In network ✓':'Out of network'}</b></div>`:''}
   ${cash?'':`<div class="kv"><span>Reference</span><b class="code">${r.ref} · ${r.time}</b></div>`}</div>
   <div style="background:#000;color:#fff;border-radius:12px;padding:18px;margin-top:16px"><div style="color:#aaa;font-size:12px;font-weight:800;letter-spacing:.6px">ESTIMATE · 0191 CONSULT</div>
   <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 14px"><div><div style="color:#aaa;font-size:12px">Practice fee</div><b style="font-size:18px">${money(d.fee)}</b></div><div><div style="color:#aaa;font-size:12px">Scheme pays</div><b style="font-size:18px">${money(d.scheme)}</b></div><div><div style="color:#aaa;font-size:12px">Patient pays</div><b style="font-size:18px;color:${d.pt?'#ffc043':'var(--ac)'}">${money(d.pt)}</b></div></div>

  <div class="mact"><button class="btn sec" data-a="closeModal">Cancel — choose another drug</button><button class="btn red" data-a="override">Prescribe anyway</button></div></div>`}
 if(m.type==='book'){const opts=S.patients.map(p=>`<option value="${p.id}" ${m.pid===p.id?'selected':''}>${esc(fullName(p))}</option>`).join('');
  h=`<div class="modal"><h2>Book appointment</h2><form id="mf"><div class="grid2"><div class="f"><label>Date</label><input type="date" name="date" value="${m.date}"></div><div class="f"><label>Time</label><input type="time" name="time" step="1800" value="${m.time}"></div></div>
  <div class="f"><label>Patient</label><select name="pid">${opts}</select></div><div class="f"><label>Type</label><select name="type"><option>Consult</option><option>Follow-up</option><option>Chronic review</option><option>Telehealth</option><option>Procedure</option></select></div>
  <div class="f"><label>Reason</label><input name="reason" placeholder="e.g. Cough for a week"></div></form>
  <p class="sub sm">Patient receives an SMS confirmation and a reminder 24 h before.</p>
  <div class="mact"><button class="btn sec" data-a="newPatient">New patient instead</button><button class="btn sec" data-a="closeModal">Cancel</button><button class="btn" data-a="saveBooking">Book</button></div></div>`}
 if(m.type==='walkin'){h=`<div class="modal"><h2>Walk-in consult</h2><form id="mf"><div class="f"><label>Patient</label><select name="pid">${S.patients.map(p=>`<option value="${p.id}">${esc(fullName(p))}</option>`).join('')}</select></div><div class="f"><label>Reason</label><input name="reason" placeholder="Presenting complaint"></div></form>
  <div class="mact"><button class="btn sec" data-a="newPatient">New patient</button><button class="btn sec" data-a="closeModal">Cancel</button><button class="btn ac" data-a="saveWalkin">Start consult</button></div></div>`}
 if(m.type==='patient'){h=`<div class="modal"><h2>New patient</h2><form id="mf"><div class="grid2"><div class="f"><label>First name</label><input name="first"></div><div class="f"><label>Surname</label><input name="last"></div>
  <div class="f"><label>Date of birth</label><input type="date" name="dob" value="1990-01-01"></div><div class="f"><label>Sex</label><select name="sex"><option value="F">Female</option><option value="M">Male</option></select></div>
  <div class="f"><label>ID / passport</label><input name="idno"></div><div class="f"><label>Cell</label><input name="phone" placeholder="082 000 0000"></div>
  <div class="f"><label>Medical aid</label><select name="scheme"><option>Private (cash)</option><option>Discovery Health</option><option>Bonitas</option><option>Momentum Health</option><option>GEMS</option><option>Bestmed</option><option>Medshield</option><option>Fedhealth</option></select></div><div class="f"><label>Member no.</label><input name="no"></div></div>
  <label>Known drug allergies</label>${Object.entries(CLSP).map(([k,v])=>`<label class="checkrow" style="text-transform:none;letter-spacing:0;color:#000"><input type="checkbox" name="al_${k}"> ${v}</label>`).join('')}
  <div class="f" style="margin-top:10px"><label>Chronic conditions (comma-separated)</label><input name="chronic" placeholder="e.g. Hypertension, Asthma"></div>
  <label class="checkrow" style="text-transform:none;letter-spacing:0;color:#000"><input type="checkbox" name="consent" checked> Patient gave POPIA consent to process health information</label></form>
  <div class="mact"><button class="btn sec" data-a="closeModal">Cancel</button><button class="btn" data-a="savePatient">Save patient</button></div></div>`}
 return `<div class="mask" data-a="maskClose">${h}</div>`}

/* ---------- render ---------- */
function render(){
 const app=$('#app');
 if(!S.auth){app.innerHTML=loginView();return}
 const V={today:todayView,bookings:bookingsView,patients:patientsView,patient:patientView,consult:consultView,claims:claimsView,scripts:scriptsView,notes:notesView,practice:practiceView};
 app.innerHTML=`<div class="shell">${side()}<main class="main">${V[S.view]()}</main></div>${S.modal?modalView():''}`;
}
const UPD={vflags,snprev:snPrev,bill:billBox};

/* ---------- actions ---------- */
function beginConsult(a){
 if(S.consult&&S.consult.apptId!==a.id){toast('Finish or abandon the current consult first');S.view='consult';render();return}
 a.status='in';
 S.consult={apptId:a.id,pid:a.pid,start:Date.now(),tab:'notes',vitals:{},soap:{s:a.reason||'',o:'',a:'',p:''},dx:[],rx:[],rxSent:null,
  sn:{from:TODAY,days:2,fitness:'total',basis:'exam',showDx:false,remarks:''},snIssued:null,tariff:'0191',pharmacy:PHARM[0]};
 S.icdq='';S.drq='';S.view='consult';S.modal=null;render();scrollTo(0,0)}
function addRxLine(d,warn,override){S.consult.rx.push({id:d.id,name:d.name,str:d.str,form:d.form,sig:d.sig,qty:d.qty,rep:0,warn,override});S.drq='';render()}
function openVerify(pid,apptId){const p=P(pid);
 if(!p.ma||p.ma.state==='cash'){S.modal={type:'verify',pid,apptId,phase:'done',res:runCheck(p)};render();return}
 const tok=uid();S.modal={type:'verify',pid,apptId,phase:'loading',tok};render();
 setTimeout(()=>{if(S.modal&&S.modal.tok===tok){S.modal.phase='done';S.modal.res=runCheck(p);render()}},1700)}
function openDoc(html){S.modal={type:'doc',html};render()}
function formData(){const f=$('#mf');return f?Object.fromEntries(new FormData(f)):{}}

const act={
 login(){S.auth=true;render()},
 logout(){S.auth=false;render()},
 nav(v){S.view=v;S.modal=null;render();scrollTo(0,0)},
 openPatient(v){S.pid=v;S.view='patient';render();scrollTo(0,0)},
 checkin(v){const a=A(v);openVerify(a.pid,v)},
 verify(v){openVerify(v,null)},
 confirmCheckin(v){const a=A(v);a.status='arrived';a.ver=S.modal.res;S.modal=null;toast(fullName(P(a.pid))+' checked in · '+a.ver.dec.label);render()},
 start(v){beginConsult(A(v))},
 walkin(){S.modal={type:'walkin'};render()},
 walkinFor(v){const a={id:uid(),date:TODAY,time:nowHM(),pid:v,reason:'Walk-in',type:'Consult',status:'arrived'};S.appts.push(a);beginConsult(a)},
 saveWalkin(){const f=formData();const a={id:uid(),date:TODAY,time:nowHM(),pid:f.pid,reason:f.reason||'Walk-in',type:'Consult',status:'arrived'};S.appts.push(a);beginConsult(a)},
 book(v){S.modal={type:'book',date:S.date,time:v,pid:S.patients[0].id};render()},
 bookFor(v){S.modal={type:'book',date:addDays(TODAY,1),time:'09:30',pid:v};render()},
 saveBooking(){const f=formData();if(S.appts.some(a=>a.date===f.date&&a.time===f.time)){toast('That slot is taken');return}
  S.appts.push({id:uid(),date:f.date,time:f.time,pid:f.pid,reason:f.reason||f.type,type:f.type,status:'booked'});S.modal=null;S.date=f.date;S.view='bookings';toast('Booked · SMS confirmation sent to '+P(f.pid).first);render()},
 newPatient(){S.modal={type:'patient'};render()},
 savePatient(){const f=formData();if(!f.first||!f.last){toast('Name and surname are required');return}if(!f.consent){toast('POPIA consent is required to open a file');return}
  const p={id:uid(),first:f.first,last:f.last,dob:f.dob,sex:f.sex,idno:f.idno||'—',phone:f.phone||'—',aid:{scheme:f.scheme,plan:'',no:f.no||'',dep:'00'},
   ma:/cash/i.test(f.scheme)?{state:'cash'}:{state:'active',pot:'savings',avail:2500,total:5000,pmb:[],network:true,rate:480},allergies:Object.keys(CLSP).filter(k=>f['al_'+k]).map(k=>({cls:k,reaction:'reported by patient'})),chronic:(f.chronic||'').split(',').map(s=>s.trim()).filter(Boolean),meds:[],consent:true,history:[]};
  S.patients.push(p);S.modal=null;S.pid=p.id;S.view='patient';toast('Patient file created');render()},
 day(v){S.date=+v===0?TODAY:addDays(S.date,+v);render()},
 tab(v){S.consult.tab=v;render();scrollTo(0,0)},
 objChip(v){const c=S.consult;c.soap.o=(c.soap.o?c.soap.o.replace(/\s*$/,'')+(/[.]$/.test(c.soap.o.trim())?' ':'. '):'')+v+'.';const t=$('#soapO');if(t)t.value=c.soap.o},
 addDx(v){const c=S.consult;if(!c.dx.includes(v))c.dx.push(v);if(!c.soap.a)c.soap.a=icdName(v);S.icdq='';render()},
 rmDx(v){S.consult.dx.splice(+v,1);render()},
 primDx(v){const c=S.consult;const [x]=c.dx.splice(+v,1);c.dx.unshift(x);render()},
 addDrug(v){const d=DRUG[v],p=P(S.consult.pid);const w=checkDrug(d,p);
  if(w.some(x=>x.lvl==='al')){S.modal={type:'override',drug:v,warn:w};render();return}
  if(w.length)toast('Added with caution — review the warning');addRxLine(d,w,null)},
 override(){const f=formData();if(!f.reason||f.reason.trim().length<5){toast('Give an override reason');return}const m=S.modal;S.modal=null;addRxLine(DRUG[m.drug],m.warn,f.reason.trim())},
 rmRx(v){S.consult.rx.splice(+v,1);render()},
 newRx(){S.consult.rxSent=null;S.consult.rx=[];render()},
 previewRx(){const c=S.consult;openDoc(rxDoc({no:'RX-'+(S.seq.rx+1)+' (draft)',pid:c.pid,date:TODAY,items:c.rx,dx:c.dx,pharmacy:c.pharmacy,signed:false}))},
 sendRx(){const c=S.consult;if(!c.rx.length)return;const no='RX-'+(++S.seq.rx);const paper=/Print/.test(c.pharmacy);
  const s={no,pid:c.pid,date:TODAY,time:nowHM(),items:c.rx.map(r=>({...r})),dx:[...c.dx],pharmacy:c.pharmacy,status:paper?'paper':'sent',signed:true};
  S.scripts.unshift(s);c.rxSent=no;render();
  if(paper){openDoc(rxDoc(s));return}
  toast(no+' signed and sent to '+c.pharmacy.split(' —')[0]);
  setTimeout(()=>{s.status='received';toast(c.pharmacy.split(' —')[0]+' received '+no);refreshLive()},3500);
  setTimeout(()=>{s.status='ready';toast(no+' ready — SMS sent to patient');refreshLive()},9000)},
 viewRx(v){openDoc(rxDoc(S.scripts.find(s=>s.no===v)))},
 issueSN(){const c=S.consult;const no='SN-'+(++S.seq.sn);const sn={...c.sn,days:Math.max(1,+c.sn.days||1),time:nowHM()};
  S.notes.unshift({no,pid:c.pid,date:TODAY,sn,dx:[...c.dx]});c.snIssued=no;toast('Sick note '+no+' issued');openDoc(snDoc(sn,P(c.pid),c.dx,no,TODAY))},
 viewSN(v){const n=S.notes.find(x=>x.no===v);openDoc(snDoc(n.sn,P(n.pid),n.dx,n.no,n.date))},
 emailSN(){toast('Sick note emailed to patient as PDF')},
 finish(){const c=S.consult,p=P(c.pid),a=A(c.apptId);
  if(!c.dx.length){toast('Add an ICD-10 diagnosis before closing');S.consult.tab='dx';render();return}
  if(c.rx.length&&!c.rxSent){toast('Script not sent — send or remove items first');S.consult.tab='rx';render();return}
  const n=c.snIssued&&S.notes.find(x=>x.no===c.snIssued);
  p.history.unshift({date:TODAY,reason:a.reason,dx:c.dx[0],note:[c.soap.a,c.soap.p].filter(Boolean).join('. ')||'Seen.',rx:c.rxSent?S.scripts.find(s=>s.no===c.rxSent).items.map(i=>i.name):[],sn:n?n.sn.days+' day(s)':''});
  a.status='done';const d=decide(p,c.tariff);S.consult=null;S.view='today';
  if(d.scheme>0){const no='CL-'+(++S.seq.cl);S.claims.unshift({no,pid:p.id,date:TODAY,time:nowHM(),scheme:p.aid.scheme,code:c.tariff,icd:c.dx.join(', '),fee:d.fee,paid:d.scheme,pt:d.pt,status:'Accepted'});
   toast('Claim '+no+' accepted in real time · scheme pays '+money(d.scheme));if(d.pt)setTimeout(()=>toast('Reception: collect '+money(d.pt)+' from patient'),900)}
  else toast('Consult closed · invoice of '+money(d.pt)+' sent to reception');
  render();scrollTo(0,0)},
 cancelConsult(){if(!confirmAbandon())return;A(S.consult.apptId).status='arrived';S.consult=null;S.view='today';toast('Consult abandoned — patient back in waiting room');render()},
 closeModal(){S.modal=null;render()},
 maskClose(v,el,e){if(e.target===el){S.modal=null;render()}},
 print(){$('#print-root').innerHTML=S.modal.html;try{window.print()}catch(e){}toast('Print / PDF export is enabled in the production build')}
};
let abandonArmed=0;
function confirmAbandon(){if(Date.now()-abandonArmed<4000)return true;abandonArmed=Date.now();toast('Tap “Abandon consult” again to confirm');return false}
function refreshLive(){if(S.modal)return;if(S.view==='scripts'||S.view==='today'){render();return}
 if(S.view==='consult'&&S.consult&&S.consult.rxSent){const s=S.scripts.find(x=>x.no===S.consult.rxSent);const el=$('#rxstat');if(el&&s)el.innerHTML=rxPill(s.status)}}

document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a;
 if(a==='maskClose'){if(e.target===el){S.modal=null;render()}return}
 e.preventDefault();act[a]&&act[a](el.dataset.v,el,e)});
document.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.bind)setPath(t.dataset.bind,t.type==='checkbox'?t.checked:t.value);
 if(t.dataset.upd){const n=$('#'+t.dataset.upd);if(n)n.innerHTML=UPD[t.dataset.upd]()}
 if(t.dataset.filter==='pt'){S.ptq=t.value;$('#ptlist').innerHTML=ptRows()}
 if(t.dataset.filter==='icd'){S.icdq=t.value;$('#icdres').innerHTML=icdRes()}
 if(t.dataset.filter==='dr'){S.drq=t.value;$('#drres').innerHTML=drRes()}
 if(t.dataset.bind==='doc.name'||t.dataset.bind==='doc.practice'){const w=$('.who');if(w)w.innerHTML=`<b>${esc(S.doc.name)}</b>${esc(S.doc.practice)}<br><button class="link" style="color:#aaa;margin-top:8px" data-a="logout">Sign out</button>`}
});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.bind&&(t.tagName==='SELECT'||t.type==='checkbox')){setPath(t.dataset.bind,t.type==='checkbox'?t.checked:t.value);if(t.dataset.upd){const n=$('#'+t.dataset.upd);if(n)n.innerHTML=UPD[t.dataset.upd]()}}});
setInterval(()=>{if(!S.consult)return;document.querySelectorAll('.ctimer').forEach(el=>el.textContent=dur(Date.now()-S.consult.start))},1000);
render();
</script></body></html>
